<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
  <style>
    /* make the iframe/page background transparent */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    /* ensure the model-viewer canvas is transparent */
    model-viewer {
            width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <model-viewer
    src="./model.glb"
    ios-src="./modelz.usd"
    alt="A 3D model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="./Studio_MediumContrast.hdr"
    shadow-intensity="1"
    exposure="1"
    auto-rotate
    camera-orbit="45deg 75deg auto"
    field-of-view="30deg"
    camera-controls
    style="background: transparent;">
  </model-viewer>
</body>
</html>
